name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main  # 主分支有提交时触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-glightbox mkdocs-pdf ghp-import # 安装 mkdocs、主题和部署工具
          
      - name: Build MkDocs main site
        run: |
          mkdocs build --strict

      - name: Build Quartz DL notes
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git .quartz-dl
          cp quartz-dl/config/quartz.config.yaml .quartz-dl/quartz.config.yaml
          cp quartz-dl/config/quartz.ts .quartz-dl/quartz.ts
          cp quartz-dl/config/custom.scss .quartz-dl/quartz/styles/custom.scss
          rm -rf .quartz-dl/content
          cp -R quartz-dl/content .quartz-dl/content
          cd .quartz-dl
          npm ci
          npx quartz plugin install --from-config
          npx quartz build --output ../site/DL

      - name: Deploy combined site
        run: |
          ghp-import -n -p -f site
          
      - name: Clean up (确保本地不残留)
        run: |
          rm -rf site/ .quartz-dl/  # 手动删除可能生成的目录
