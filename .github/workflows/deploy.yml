name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main  # 主分支有提交时触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-glightbox mkdocs-pdf ghp-import # 安装 mkdocs、主题和部署工具
          
      - name: Build MkDocs main site
        run: |
          mkdocs build --strict

      - name: Deploy combined site
        run: |
          ghp-import -n -p -f site
          
      - name: Clean up (确保本地不残留)
        run: |
          rm -rf site/  # 手动删除可能生成的目录
